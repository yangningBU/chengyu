<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yony.io</title>
<meta name="description" content="yony.io — a new Chinese idiom (成语) every day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e7;
    --card: #fbf8f2;
    --ink: #1f1b16;
    --muted: #6f665a;
    --rule: #e2d9c8;
    --seal: #b3261e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14120f;
      --card: #1c1915;
      --ink: #eee6d6;
      --muted: #a39886;
      --rule: #2f2a23;
      --seal: #e0584c;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 1rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    max-width: 40rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding-bottom: 1.25rem;
  }
  .stamp {
    width: 1.1rem;
    height: 1.1rem;
    border-radius: 3px;
    background: var(--seal);
  }
  h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  main {
    width: 100%;
    max-width: 40rem;
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 1.25rem;
    padding: 1.75rem 1.25rem 2rem;
    text-align: center;
  }

  .eyebrow {
    margin: 0;
    font-size: 1.5rem;
    line-height: 1.3;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  /* negative margin cancels the trailing letter-spacing so the line stays centered */
  .eyebrow .zh { display: block; letter-spacing: 0.3em; margin-right: -0.3em; }
  .date {
    margin: 0 0 0.5rem;
    font-size: 1.02rem;
    line-height: 1.3;
    text-align: left;
    color: var(--muted);
  }

  .idiom {
    display: flex;
    justify-content: center;
    gap: 0.08em;
    margin: 1.75rem 0 1.5rem;
    /* four glyphs + gaps must fit inside body + card padding (~5rem total) */
    font-size: min(8rem, calc((100vw - 5.5rem) / 4.4));
  }
  .char {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 1em;
  }
  .char .py {
    font-size: max(0.8rem, 0.14em);
    color: var(--muted);
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  .char .hz {
    font-family: "Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", serif;
    line-height: 1.1;
    font-weight: 400;
  }

  .divider {
    width: 2.5rem;
    height: 2px;
    margin: 0 auto 1.5rem;
    background: var(--seal);
    border-radius: 2px;
  }

  .meaning {
    margin: 0 auto 0.9rem;
    max-width: 30rem;
    font-size: 1.05rem;
    line-height: 1.8;
  }
  .translation {
    margin: 0 auto;
    max-width: 30rem;
    font-size: 0.95rem;
    color: var(--muted);
  }

  .explanation {
    margin: 1.5rem auto 0;
    max-width: 30rem;
    font-size: 0.9rem;
    line-height: 1.7;
    text-align: left;
  }

  .example {
    margin: 1.5rem auto 0;
    max-width: 30rem;
    padding: 1rem 1.1rem;
    border-radius: 0.75rem;
    background: var(--paper);
    text-align: left;
  }
  .example .label {
    margin: 0 0 0.5rem;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .example .label .zh { letter-spacing: 0.3em; margin-right: 0.35em; }
  .example .zh-sentence {
    margin: 0 0 0.35rem;
    font-size: 1rem;
    line-height: 1.8;
  }
  .example mark {
    background: none;
    color: var(--seal);
    font-weight: 600;
  }
  .example .en-sentence {
    margin: 0;
    font-size: 0.875rem;
    color: var(--muted);
  }

  .status {
    color: var(--muted);
    font-size: 0.95rem;
    padding: 3rem 0;
  }

  footer {
    width: 100%;
    max-width: 40rem;
    padding-top: 1.5rem;
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
  }

  @media (min-width: 640px) {
    body { padding-top: 3rem; }
    header { padding-bottom: 2rem; }
    .card { padding: 2.5rem 2.5rem 3rem; }
    .idiom { font-size: min(8rem, calc((100vw - 8rem) / 4.4)); }
    .meaning { font-size: 1.15rem; }
    .translation { font-size: 1rem; }
  }
</style>
</head>
<body>
  <header>
    <span class="stamp" aria-hidden="true"></span>
    <h1>yony.io</h1>
  </header>

  <main>
    <p class="date" id="date"></p>
    <section class="card" aria-live="polite">
      <p class="eyebrow"><span class="zh" lang="zh">今日成语</span>Chengyu of the day</p>
      <div id="content"><p class="status">Loading…</p></div>
    </section>
  </main>

  <footer>A new idiom every day</footer>

<script>
  const CSV_URL = "chengyu.csv";
  const EPOCH = Date.UTC(2026, 0, 1); // day 0 of the rotation
  const HISTORY = 30;                 // days before an idiom may repeat

  // Minimal RFC 4180 CSV parser (handles quoted fields, commas, "" escapes).
  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') quoted = false;
        else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    const [header, ...body] = rows;
    return body
      .filter(r => r.some(Boolean))
      .map(r => Object.fromEntries(header.map((h, i) => [h.trim(), (r[i] || "").trim()])));
  }

  // Small deterministic PRNG so every visitor sees the same idiom on the same day.
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function dayNumber(date) {
    const local = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
    return Math.abs(Math.floor((local - EPOCH) / 86400000));
  }

  // Replays the rotation from the epoch, keeping a rolling record of the last
  // HISTORY picks and excluding them from each day's draw. Returns today's index.
  function pickForDay(day, count) {
    const windowSize = Math.min(HISTORY, count - 1);
    const recent = [];
    let pick = 0;
    for (let d = 0; d <= day; d++) {
      const excluded = new Set(recent);
      const pool = [];
      for (let i = 0; i < count; i++) if (!excluded.has(i)) pool.push(i);
      pick = pool[Math.floor(mulberry32(d * 7919 + 17)() * pool.length)];
      recent.push(pick);
      if (recent.length > windowSize) recent.shift();
    }
    return pick;
  }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function render(idiom) {
    const content = document.getElementById("content");
    content.replaceChildren();

    const chars = [...idiom.chinese];
    const syllables = idiom.pinyin.split(/\s+/);
    const row = el("div", "idiom");
    row.lang = "zh";
    chars.forEach((ch, i) => {
      const col = el("div", "char");
      col.append(el("span", "py", syllables[i] || ""), el("span", "hz", ch));
      row.append(col);
    });
    row.setAttribute("aria-label", `${idiom.chinese} (${idiom.pinyin})`);

    const meaning = el("p", "meaning", idiom.meaning);
    meaning.lang = "zh";

    content.append(row, el("div", "divider"), meaning, el("p", "translation", idiom.translation));

    if (idiom.explanation) content.append(el("p", "explanation", idiom.explanation));

    if (idiom.example) {
      const box = el("div", "example");
      const label = el("p", "label");
      label.append(el("span", "zh", "例句"), "Example");
      const zh = el("p", "zh-sentence");
      zh.lang = "zh";
      // Highlight the idiom inside the example sentence.
      idiom.example.split(idiom.chinese).forEach((part, i) => {
        if (i) zh.append(el("mark", null, idiom.chinese));
        zh.append(part);
      });
      box.append(label, zh, el("p", "en-sentence", idiom.example_translation));
      content.append(box);
    }
    document.title = `${idiom.chinese} · yony.io`;
  }

  async function main() {
    const today = new Date();
    document.getElementById("date").textContent = today.toLocaleDateString("en-US", {
      weekday: "long", month: "long", day: "numeric", year: "numeric",
    });

    try {
      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const idioms = parseCSV(await res.text());
      if (!idioms.length) throw new Error("no idioms found");
      render(idioms[pickForDay(dayNumber(today), idioms.length)]);
    } catch (err) {
      console.error(err);
      document.getElementById("content").replaceChildren(
        el("p", "status", "Couldn't load today's idiom. Serve this folder over HTTP (e.g. python3 -m http.server) rather than opening the file directly.")
      );
    }
  }

  main();
</script>
</body>
</html>
